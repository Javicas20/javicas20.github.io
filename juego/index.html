<title>Javier Casero · CV RPG</title>
<meta name="description" content="El CV de Javier Casero, desarrollador móvil, convertido en un pequeño RPG: recorre el pueblo, habla con la gente y llena tu inventario.">

<style>
  /* La interfaz usa la misma paleta que el CV clásico (Android Studio oscuro);
     el mundo, en cambio, es pixel art luminoso dibujado en canvas. */
  :root {
    --bg:         #18191b;
    --bg-raised:  #1e1f22;
    --bg-sunk:    #2b2d30;
    --line:       #393b40;
    --ink:        #bcbec4;
    --ink-strong: #dfe1e5;
    --ink-dim:    #9da0a8;
    --ink-faint:  #7a7e85;
    --amber:      #cf8e6d;
    --amber-dim:  #a8724f;
    --live:       #6aab73;
    --blue:       #56a8f5;
    --cyan:       #2aacb8;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; overscroll-behavior: none; }
  body { color: var(--ink); font-family: var(--mono); font-size: 14px; -webkit-tap-highlight-color: transparent; }
  #game { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; cursor: pointer; }

  .btn {
    font: 500 12px/1 var(--mono);
    color: var(--ink-strong);
    background: rgba(30, 31, 34, .9);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 10px;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--amber-dim); color: var(--amber); }
  .btn:focus-visible, .choice:focus-visible, a:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .btn.primary { background: var(--amber); border-color: var(--amber); color: #1e1f22; font-weight: 700; }
  .btn.primary:hover { background: #dba083; color: #1e1f22; }
  .btn b { color: var(--amber); font-weight: 700; }
  .short { display: none; }

  /* ---- HUD ---- */
  .hud {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; gap: 6px; align-items: center;
    padding: 10px 12px; padding-top: max(10px, env(safe-area-inset-top));
    pointer-events: none;
  }
  .hud > * { pointer-events: auto; }
  .hud .spacer { flex: 1; pointer-events: none; }
  @media (max-width: 640px) {
    .hud { gap: 4px; padding-left: 8px; padding-right: 8px; }
    .btn { padding: 7px 7px; font-size: 11px; }
    .long { display: none; }
    .short { display: inline; }
  }

  /* ---- diálogo ---- */
  #dialog {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: max(12px, env(safe-area-inset-bottom));
    width: min(720px, calc(100% - 24px));
    min-height: 118px;
    background: rgba(30, 31, 34, .97);
    border: 2px solid var(--amber-dim);
    border-radius: 8px;
    box-shadow: 0 0 0 3px rgba(24, 25, 27, .85), 0 18px 40px -16px rgba(0, 0, 0, .8);
    padding: 12px 16px 14px;
    cursor: pointer;
  }
  #dialog[hidden], #panel[hidden], #title[hidden], #hint[hidden] { display: none; }
  #dialog .who { font: 700 11.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--amber); margin-bottom: 8px; }
  #dialog .txt { font: 400 16px/1.5 var(--sans); color: var(--ink-strong); min-height: 48px; }
  #dialog .txt b { color: #e8b48f; font-weight: 600; }
  #dialog .txt a, .panel a { color: var(--blue); }
  #dialog .next { position: absolute; right: 14px; bottom: 8px; color: var(--amber); font-size: 12px; animation: blink 1s steps(2) infinite; }
  #dialog .next[hidden] { display: none; }
  @keyframes blink { 50% { opacity: 0; } }
  .choices { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .choices:empty { display: none; }
  .choice {
    font: 500 14px/1.35 var(--sans); text-align: left;
    color: var(--ink-strong); background: var(--bg-sunk);
    border: 1px solid var(--line); border-radius: 6px; padding: 9px 12px; cursor: pointer;
  }
  .choice::before { content: "▸ "; color: var(--amber); }
  .choice:hover, .choice:focus-visible { border-color: var(--amber-dim); }
  @media (max-width: 520px) { #dialog .txt { font-size: 15px; } }

  /* ---- paneles ---- */
  #panel {
    position: absolute; inset: 0;
    background: rgba(10, 11, 12, .55);
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .panel {
    position: relative;
    width: min(580px, 100%);
    max-height: min(82dvh, 760px);
    overflow: auto;
    background: var(--bg-raised);
    border: 2px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 0 0 3px rgba(24, 25, 27, .85), 0 24px 60px -20px rgba(0, 0, 0, .9);
    padding: 20px 20px 22px;
  }
  .panel .x { position: absolute; top: 12px; right: 12px; }
  .panel h2 { margin: 0 0 4px; font: 700 16px/1.3 var(--mono); color: var(--ink-strong); padding-right: 64px; }
  .panel .sub { margin: 0 0 16px; font: 400 14px/1.5 var(--sans); color: var(--ink-dim); }
  .panel h3 { margin: 18px 0 8px; font: 700 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); }
  .panel p { font: 400 14.5px/1.55 var(--sans); color: var(--ink); margin: 0 0 10px; }
  .panel p b { color: var(--ink-strong); font-weight: 600; }
  .rows { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; }
  .rows dt { font: 500 12px/1.6 var(--mono); color: var(--amber); }
  .rows dd { margin: 0; font: 400 14px/1.5 var(--sans); color: var(--ink-strong); }
  @media (max-width: 460px) { .rows { grid-template-columns: 1fr; gap: 0; } .rows dd { margin-bottom: 8px; } }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: 500 12px/1 var(--mono); color: var(--ink-strong); background: var(--bg-sunk); border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .quests { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .quests li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg-sunk); font: 400 14px/1.4 var(--sans); color: var(--ink-strong); }
  .quests li .chk { width: 18px; height: 18px; flex: none; border: 1.5px solid var(--ink-faint); border-radius: 4px; display: grid; place-items: center; font: 700 12px/1 var(--mono); color: #1e1f22; }
  .quests li.done { color: var(--ink-dim); }
  .quests li.done .chk { background: var(--live); border-color: var(--live); }
  .quests li .t { flex: 1; }
  .quests li .p { font: 500 12px/1 var(--mono); color: var(--amber); }
  .quests li .btn { padding: 6px 9px; font-size: 11px; }
  .bar { height: 6px; background: var(--bg-sunk); border-radius: 3px; overflow: hidden; margin: 0 0 14px; }
  .bar i { display: block; height: 100%; background: var(--live); }
  .inv { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px; }
  .item { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg-sunk); font: 400 13.5px/1.3 var(--sans); color: var(--ink-strong); }
  .ic { width: 28px; height: 28px; flex: none; border-radius: 5px; display: grid; place-items: center; font: 700 11px/1 var(--mono); color: #18191b; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .22); }
  .item.locked { opacity: .45; }
  .item.locked .ic { background: var(--line) !important; color: var(--ink-faint); }
  .minimap { display: block; width: 100%; height: auto; image-rendering: pixelated; border-radius: 6px; border: 1px solid var(--line); margin-bottom: 12px; cursor: pointer; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font: 400 12px/1 var(--mono); color: var(--ink-dim); margin: 0 0 12px; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }

  /* ---- portada ---- */
  #title {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    background: radial-gradient(ellipse at center, rgba(24, 25, 27, .55), rgba(24, 25, 27, .92));
  }
  .card { width: min(520px, 100%); text-align: center; }
  .kicker { font: 700 12px/1 var(--mono); letter-spacing: .24em; color: var(--amber); margin: 0 0 14px; }
  .card h1 { font: 700 clamp(26px, 6vw, 40px)/1.1 var(--mono); color: var(--ink-strong); margin: 0 0 8px; letter-spacing: -.01em; text-shadow: 0 3px 0 #000; }
  .card .role { font: 500 13px/1.4 var(--mono); color: var(--live); margin: 0 0 18px; }
  .card p { font: 400 15.5px/1.55 var(--sans); color: var(--ink); margin: 0 0 22px; }
  .card .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .card .btn { padding: 12px 16px; font-size: 13px; }
  .card .ctrl { font: 400 12px/1.5 var(--mono); color: var(--ink-faint); margin: 20px 0 0; }

  #toasts { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
  .toast { font: 500 12.5px/1 var(--mono); color: var(--ink-strong); background: rgba(30, 31, 34, .95); border: 1px solid var(--live); border-radius: 6px; padding: 8px 12px; animation: toast 2.6s ease forwards; }
  .toast b { color: var(--live); }
  @keyframes toast { 0% { opacity: 0; transform: translateY(-6px); } 10%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; } }
  #hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: max(16px, env(safe-area-inset-bottom)); font: 500 12px/1 var(--mono); color: var(--ink-strong); background: rgba(30, 31, 34, .85); border: 1px solid var(--line); border-radius: 20px; padding: 9px 14px; white-space: nowrap; pointer-events: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) {
    #dialog .next, .toast { animation: none; }
  }
</style>
<script>
  /* Mismo idioma que el CV clásico: comparten la clave "cv-lang". */
  (function () {
    var l = null;
    try { l = localStorage.getItem("cv-lang"); } catch (e) {}
    if (!l) l = /^es\b/i.test(navigator.language || "") ? "es" : "en";
    document.documentElement.setAttribute("data-lang", l);
    document.documentElement.lang = l;
  })();
</script>

  <div id="toasts" aria-live="polite"></div>
  <div id="hint" hidden></div>

  <div id="dialog" hidden role="dialog" aria-label="Conversación">

    <div class="txt" aria-hidden="true"></div>
    <div class="sr" aria-live="polite"></div>
    <div class="choices"></div>
    <div class="next" aria-hidden="true">▼</div>
  </div>

  <div id="panel" hidden>
    <div class="panel" role="dialog" aria-modal="true">
      <button type="button" class="btn x" data-ui="close"></button>
      <div class="body"></div>
    </div>
  </div>

  <div id="title">
    <div class="card">
      <p class="kicker" data-ui="kicker"></p>
      <h1>Javier Casero Hernández</h1>
      <p class="role" data-ui="role"></p>
      <p data-ui="intro"></p>
      <div class="row">
        <button type="button" class="btn primary" id="b-start"></button>

      <p class="ctrl" id="ctrl"></p>
    </div>
  </div>

  <noscript>
    <p style="position:absolute;inset:0;display:grid;place-items:center;font:15px var(--sans);background:var(--bg)">
      <a href="../" style="color:var(--blue)">Este CV jugable necesita JavaScript. Ver el CV clásico →</a>
    </p>
  </noscript>
</div>

        P.x = x; P.y = y; P.px = x * T; P.py = y * T; P.moving = false; P.path = null; P.goal = null; P.mark = null;
        closePanel();
        talk(n);
        return;
      }
    }
  }
  function questRow(q) {
    var done = questDone(q.id), extra = "";
    if (q.id === "clientes") extra = '<span class="p">' + state.stamps.length + "/" + STAMPS.length + "</span>";
    return '<li class="' + (done ? "done" : "") + '"><span class="chk">' + (done ? "✓" : "") + '</span><span class="t">' +
      esc(L(q)) + "</span>" + extra + '<button type="button" class="btn" data-go="' + q.npc + '">' + U("go") + "</button></li>";
  }
  var RENDER = {
    quests: function () {
      var n = doneCount();
      var bonus = byId.viajero;
      return "<h2>" + U("qTitle") + " · " + n + "/" + QUESTS.length + "</h2><p class=sub>" + U("qSub") + "</p>" +
        '<div class="bar"><i style="width:' + (n / QUESTS.length * 100) + '%"></i></div>' +
        '<ul class="quests">' + QUESTS.map(questRow).join("") + "</ul>" +
        "<h3>" + U("bonus") + "</h3>" +
        '<ul class="quests">' + questRow({ id: "_b", npc: "viajero", es: "Habla con el viajero", en: "Talk to the traveller" })
          .replace('class=""', 'class="' + (state.talked[bonus.id] ? "done" : "") + '"')
          .replace('<span class="chk"></span>', '<span class="chk">' + (state.talked[bonus.id] ? "✓" : "") + "</span>") + "</ul>" +
        '<div class="links"><button type="button" class="btn" data-act="reset">' + U("reset") + "</button></div>";
    },
    map: function () {
      var places = [["perfil", BUILDINGS[0].label], ["profe", BUILDINGS[1].label], ["recepcion", BUILDINGS[2].label],
        ["arquitecta", { es: "Design System", en: "Design System" }], ["market", { es: U("market"), en: U("market") }],
        ["encargada", BUILDINGS[5].label], ["bot", BUILDINGS[3].label], ["cartero", BUILDINGS[4].label], ["viajero", byId.viajero.name]];
      return "<h2>" + U("mapTitle") + "</h2><p class=sub>" + U("mapSub") + "</p>" +
        '<canvas class="minimap" width="' + MW * T + '" height="' + MH * T + '"></canvas>' +
        '<div class="legend"><span><i style="background:#f4c430"></i>' + U("lgPend") + '</span><span><i style="background:#6aab73"></i>' +
        U("lgDone") + '</span><span><i style="background:#56a8f5"></i>' + U("lgYou") + "</span></div>" +
        '<ul class="quests">' + places.map(function (p) {
          var done = p[0] === "market" ? questDone("clientes") : !!state.talked[p[0]];
          return '<li class="' + (done ? "done" : "") + '"><span class="chk">' + (done ? "✓" : "") + '</span><span class="t">' +
            esc(L(p[1])) + '</span><button type="button" class="btn" data-go="' + p[0] + '">' + U("go") + "</button></li>";
        }).join("") + "</ul>";
    },
    sheet: function () {
      var es = lang === "es";
      var rows = es ? [
        ["Nombre", "Javier Casero Hernández"],
        ["Clase", "Desarrollador móvil · Android y Kotlin Multiplatform"],
        ["Gremio", "Magellan Partners (antes Worldline MeTS) · desde 2023"],
        ["Facción", "MarwanAI · co-fundador · desde 2025"],
        ["Proyecto", "Turito · SaaS propio en producción"],
        ["Origen", "España"],
        ["Idiomas", "Español nativo · Inglés intermedio · Portugués básico"]
      ] : [
        ["Name", "Javier Casero Hernández"],
        ["Class", "Mobile developer · Android and Kotlin Multiplatform"],
        ["Guild", "Magellan Partners (formerly Worldline MeTS) · since 2023"],
        ["Faction", "MarwanAI · co-founder · since 2025"],
        ["Project", "Turito · own SaaS in production"],
        ["Origin", "Spain"],
        ["Languages", "Spanish native · English intermediate · Portuguese basic"]
      ];
      var bio = es
        ? "<p>Construye aplicaciones móviles para marcas que llegan a mucha gente. Desarrolla el <b>Design System</b> que comparten las apps de retail del grupo, con <b>Kotlin Multiplatform</b> y <b>Compose Multiplatform</b> sobre Android e iOS.</p>" +
          "<p>Le interesa el sitio donde la arquitectura se nota en la interfaz: componentes reutilizables, código que aguanta y pantallas que se entienden solas.</p>"
        : "<p>He builds mobile apps for brands that reach a lot of people. He develops the <b>Design System</b> shared across the group's retail apps, with <b>Kotlin Multiplatform</b> and <b>Compose Multiplatform</b> on Android and iOS.</p>" +
          "<p>He's drawn to the place where architecture becomes visible in the interface: reusable components, code that holds up, and screens that explain themselves.</p>";
      var gear = ["Kotlin", "Compose Multiplatform", "Jetpack Compose", "Android SDK", "Design Systems", "SonarQube"];
      return "<h2>" + U("sheetTitle") + "</h2><p class=sub>Javier Casero Hernández</p>" +
        '<dl class="rows">' + rows.map(function (r) { return "<dt>" + r[0] + "</dt><dd>" + esc(r[1]) + "</dd>"; }).join("") + "</dl>" +
        "<h3>" + U("equip") + '</h3><div class="chips">' + gear.map(function (g) { return '<span class="chip">' + g + "</span>"; }).join("") + "</div>" +
        "<h3>" + U("bio") + "</h3>" + bio + contactLinks();
    },
    inv: function () {
      var groups = [["skill", U("gSkill")], ["edu", U("gEdu")], ["misc", U("gMisc")]];
      var html = "<h2>" + U("invTitle") + " · " + (state.items.length + state.stamps.length) + "/" + (Object.keys(ITEMS).length + STAMPS.length) +
        "</h2><p class=sub>" + U("invSub") + "</p>";
      groups.forEach(function (g) {
        var ids = Object.keys(ITEMS).filter(function (id) { return ITEMS[id].g === g[0]; });
        html += "<h3>" + g[1] + '</h3><div class="inv">' + ids.map(function (id) {
          var it = ITEMS[id], own = has(id);
          return '<div class="item' + (own ? "" : " locked") + '"><span class="ic" style="background:' + it.c + '">' + (own ? esc(it.i) : "?") +
            "</span><span>" + (own ? esc(L(it)) : "???") + "</span></div>";
        }).join("") + "</div>";
      });
      html += "<h3>" + U("gStamp") + " · " + state.stamps.length + "/" + STAMPS.length + '</h3><div class="inv">' + STAMPS.map(function (id) {
        var own = state.stamps.indexOf(id) >= 0, st = STALLS.filter(function (s) { return s.npc === id; })[0];
        return '<div class="item' + (own ? "" : " locked") + '"><span class="ic" style="background:' + st.c + '">' + (own ? "✓" : "?") +
          "</span><span>" + (own ? esc(st.label) : "???") + "</span></div>";
      }).join("") + "</div>";
      return html;
    },
    done: function () {
      return "<h2>" + U("doneTitle") + "</h2><p class=sub>" + U("doneP") + "</p>" +
        '<div class="inv">' + ["kmp", "cmp", "dsys", "cpp", "turito", "llm"].map(function (id) {
          var it = ITEMS[id];
          return '<div class="item"><span class="ic" style="background:' + it.c + '">' + esc(it.i) + "</span><span>" + esc(L(it)) + "</span></div>";
        }).join("") + "</div>" + contactLinks(true);
    }
  };
  function contactLinks(withKeep) {
    return '<div class="links">' +
      '<a class="btn primary" href="mailto:' + EMAIL + '">' + U("email") + " · " + EMAIL + "</a>" +
      '<a class="btn" href="' + LINKEDIN + '" target="_blank" rel="noopener">' + U("linkedin") + " ↗</a>" +
      '<a class="btn" href="../">' + U("classicCv") + "</a>" +
      '<a class="btn" href="../#pdf">' + U("pdf") + "</a>" +
      (withKeep ? '<button type="button" class="btn" data-act="close">' + U("keep") + "</button>" : "") +
      "</div>";
  }
  function drawMinimap() {
    var mm = panelBody.querySelector(".minimap");
    if (!mm) return;
    var g = mm.getContext("2d");
    g.drawImage(mapCanvas, 0, 0);
    function dot(x, y, c) {
      g.fillStyle = "#1b1d22"; g.beginPath(); g.arc(x * T + 8, y * T + 8, 9, 0, 7); g.fill();
      g.fillStyle = c; g.beginPath(); g.arc(x * T + 8, y * T + 8, 6.5, 0, 7); g.fill();
    }
    NPCS.forEach(function (n) {
      if (n.id === "guia") return;
      dot(n.x, n.y, state.talked[n.id] ? "#6aab73" : "#f4c430");
    });
    dot(P.x, P.y, "#56a8f5");
  }
  function openPanel(kind) {
    if (!titleEl.hidden || !dialogEl.hidden) return;
    held = []; P.path = null; P.goal = null;
    panelKind = kind;
    panelReturn = document.activeElement;
    panelBody.innerHTML = RENDER[kind]();
    panelEl.hidden = false;
    drawMinimap();
    var f = panelBody.querySelector("[data-go], a, button") || panelEl.querySelector(".x");
    panelEl.querySelector(".x").focus();
  }
  function closePanel() {
    panelEl.hidden = true; panelKind = null;
    canvas.focus({ preventScroll: true });
  }
  panelEl.addEventListener("click", function (e) {
    if (e.target === panelEl) { closePanel(); return; }
    var go = e.target.closest("[data-go]");
    if (go) { travel(go.getAttribute("data-go")); return; }
    var act = e.target.closest("[data-act]");
    if (act && act.getAttribute("data-act") === "close") closePanel();
    if (act && act.getAttribute("data-act") === "reset" && confirm(U("resetQ"))) {
      try { localStorage.removeItem(SAVE_KEY); } catch (err) {}
      state = { done: {}, items: [], stamps: [], talked: {}, finished: false, pos: null };
      P.x = 5; P.y = 23; P.px = P.x * T; P.py = P.y * T; P.dir = "down";
      NPCS.forEach(function (n) { if (n.look) n.dir = n.id === "guia" ? "left" : "down"; });
      updateHud(); closePanel();
    }
  });
  panelEl.querySelector(".x").addEventListener("click", closePanel);

  /* =====================================================================
     HUD, idioma y portada
     ===================================================================== */
  var titleEl = document.getElementById("title"), hintEl = document.getElementById("hint");
  var startBtn = document.getElementById("b-start");
  var hintShown = false;

  function updateHud() { document.getElementById("q-count").textContent = doneCount() + "/" + QUESTS.length; }
  function applyLang() {
    root.setAttribute("data-lang", lang); root.lang = lang;
    document.querySelectorAll("[data-ui]").forEach(function (el) { el.textContent = U(el.getAttribute("data-ui")); });
    document.getElementById("b-lang").setAttribute("aria-label", lang === "es" ? "Switch to English" : "Cambiar a español");
    startBtn.textContent = Object.keys(state.talked).length ? U("cont") : U("start");
    document.getElementById("ctrl").textContent = touch ? U("ctrlTouch") : U("ctrlKeys");
    hintEl.textContent = touch ? U("hintTouch") : U("hintKeys");
    canvas.setAttribute("aria-label", lang === "es" ? "Mapa del juego" : "Game map");
    document.title = "Javier Casero · CV RPG";
    if (panelKind) { panelBody.innerHTML = RENDER[panelKind](); drawMinimap(); }
    if (!dialogEl.hidden && D.npc) { D.pages = pagesFor(D.npc); D.retry = false; showPage(false); }
    updateHud();
  }
  document.getElementById("b-lang").addEventListener("click", function () {
    lang = lang === "es" ? "en" : "es";
    try { localStorage.setItem("cv-lang", lang); } catch (e) {}
    applyLang();
    this.blur(); canvas.focus({ preventScroll: true });
  });
  document.getElementById("b-quests").addEventListener("click", function () { openPanel("quests"); });
  document.getElementById("b-map").addEventListener("click", function () { openPanel("map"); });
  document.getElementById("b-sheet").addEventListener("click", function () { openPanel("sheet"); });
  document.getElementById("b-inv").addEventListener("click", function () { openPanel("inv"); });

  startBtn.addEventListener("click", function () {
    titleEl.hidden = true;
    canvas.focus({ preventScroll: true });
    if (!Object.keys(state.talked).length) talk(byId.guia);
  });
  function showHint() { if (hintShown) return; hintShown = true; hintEl.hidden = false; }
  function hideHint() { hintEl.hidden = true; }

  /* =====================================================================
     Render
     ===================================================================== */
  var canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
  var W = 0, H = 0, dpr = 1, S = 1, camX = 0, camY = 0;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = Math.floor(canvas.clientWidth * dpr); H = Math.floor(canvas.clientHeight * dpr);
    canvas.width = W; canvas.height = H;
    // En horizontal caben ~16×11 casillas; en un móvil en vertical manda el ancho (~11 casillas).
    S = Math.max(1, Math.round(H > W ? W / (T * 11) : Math.min(W / (T * 16), H / (T * 11))));
    ctx.imageSmoothingEnabled = false;
  }
  window.addEventListener("resize", resize);

  canvas.addEventListener("pointerdown", function (e) {
    // con un diálogo abierto, tocar en cualquier sitio lo hace avanzar
    if (!dialogEl.hidden && titleEl.hidden && panelEl.hidden) { e.preventDefault(); advance(); return; }
    if (blocked()) return;
    var r = canvas.getBoundingClientRect();
    var wx = ((e.clientX - r.left) * dpr + camX) / S, wy = ((e.clientY - r.top) * dpr + camY) / S;
    var tx = Math.floor(wx / T), ty = Math.floor(wy / T);
    if (!inb(tx, ty)) return;
    hideHint();
    var n = npcAt(tx, ty) || npcAt(tx, ty + 1);
    if (!n && objAt[I(tx, ty)]) n = byId[objAt[I(tx, ty)]];
    if (n) {
      if (Math.abs(n.x - P.x) + Math.abs(n.y - P.y) === 1 && !P.moving) talk(n);
      else goTalk(n);
      return;
    }
    if (walkable(tx, ty)) goTo(tx, ty);
  });

  function update(dt) {
    if (D.typing) stepType(dt);
    if (P.mark) { P.mark.t += dt; if (P.mark.t > 1.2 || (P.x === P.mark.x && P.y === P.mark.y && !P.moving)) P.mark = null; }

    if (P.moving) {
      P.prog += dt * SPEED; P.anim += dt;
      if (P.prog >= 1) {
        var left = P.prog - 1;
        P.x = P.tx; P.y = P.ty; P.moving = false; P.prog = 0;
        if (!blocked() && nextStep()) P.prog = Math.min(left, 0.9);
        else save();
      }
    } else if (!blocked()) nextStep();

    if (P.moving) {
      P.px = (P.fx + (P.tx - P.fx) * P.prog) * T;
      P.py = (P.fy + (P.ty - P.fy) * P.prog) * T;
    } else { P.px = P.x * T; P.py = P.y * T; P.anim = 0; }
  }
  function nextStep() {
    var d = held[held.length - 1];
    if (d) { P.path = null; P.goal = null; P.mark = null; return tryStep(d); }
    if (P.path && P.path.length) {
      var nx = P.path.shift();
      if (tryStep(dirTo(P.x, P.y, nx[0], nx[1]))) return true;
      P.path = null; P.goal = null; return false;
    }
    if (P.goal) { var g = P.goal; P.goal = null; P.path = null; talk(g); }
    return false;
  }

  function draw(time) {
    var ts = T * S, worldW = MW * ts, worldH = MH * ts;
    camX = worldW <= W ? -(W - worldW) / 2 : Math.max(0, Math.min(worldW - W, P.px * S + ts / 2 - W / 2));
    camY = worldH <= H ? -(H - worldH) / 2 : Math.max(0, Math.min(worldH - H, P.py * S + ts / 2 - H / 2));
    camX = Math.round(camX); camY = Math.round(camY);

    ctx.fillStyle = "#2f6e36"; ctx.fillRect(0, 0, W, H);
    ctx.drawImage(mapCanvas, -camX, -camY, worldW, worldH);

    // brillos del agua
    if (!reduce) {
      var x0 = Math.max(0, Math.floor(camX / ts)), x1 = Math.min(MW - 1, Math.floor((camX + W) / ts));
      var y0 = Math.max(0, Math.floor(camY / ts)), y1 = Math.min(MH - 1, Math.floor((camY + H) / ts));
      ctx.fillStyle = "rgba(200,230,255,.55)";
      for (var ty = y0; ty <= y1; ty++) for (var tx = x0; tx <= x1; tx++) {
        if (tile[I(tx, ty)] !== WA) continue;
        var o = Math.floor((time / 180 + hash(tx, ty, 9) * 16) % 16);
        ctx.fillRect(tx * ts + ((o + 3) % 12 + 2) * S - camX, ty * ts + (7 + (o > 8 ? 1 : 0)) * S - camY, 3 * S, S);
      }
      var sp = Math.floor(time / 140) % 3;
      ctx.fillStyle = "rgba(255,255,255,.8)";
      ctx.fillRect((FOUNTAIN.x * T + 14 + sp) * S - camX, (FOUNTAIN.y * T + 3 + sp) * S - camY, S, S);
    }

    if (P.mark) {
      ctx.strokeStyle = "rgba(255,255,255," + (0.9 - P.mark.t * 0.6) + ")"; ctx.lineWidth = Math.max(1, S / 2);
      ctx.strokeRect(P.mark.x * ts - camX + S * 2, P.mark.y * ts - camY + S * 2, ts - S * 4, ts - S * 4);
    }

    // personajes ordenados por profundidad
    var list = NPCS.filter(function (n) { return !n.door; }).map(function (n) { return { n: n, y: n.y * T }; });
    list.push({ p: true, y: P.py });
    list.sort(function (a, b) { return a.y - b.y; });
    var frame = P.moving ? [1, 0, 2, 0][Math.floor(P.anim * 9) % 4] : 0;
    list.forEach(function (e) {
      var img, x, y;
      if (e.p) { img = sprite("player", PLAYER_LOOK, P.dir, frame); x = P.px; y = P.py; }
      else { img = sprite(e.n.id, e.n.look, e.n.dir, 0); x = e.n.x * T; y = e.n.y * T; }
      ctx.drawImage(img, Math.round(x * S - camX), Math.round((y - 3) * S - camY), ts, ts);
    });

    // «!» sobre quien aún no ha hablado contigo
    var bob = reduce ? 0 : Math.round(Math.sin(time / 220) * 1.5);
    NPCS.forEach(function (n) {
      if (state.talked[n.id]) return;
      var bxp = n.x * T + 5, byp = n.y * T - (n.door ? 6 : 15) + bob;
      var X = bxp * S - camX, Y = byp * S - camY;
      if (X < -ts || Y < -ts || X > W || Y > H) return;
      ctx.fillStyle = "#1b1d22"; ctx.fillRect(X - S, Y - S, 8 * S, 11 * S);
      ctx.fillStyle = "#f4c430"; ctx.fillRect(X, Y, 6 * S, 9 * S);
      ctx.fillStyle = "#1b1d22"; ctx.fillRect(X + 2 * S, Y + S, 2 * S, 4 * S); ctx.fillRect(X + 2 * S, Y + 6 * S, 2 * S, 2 * S);
    });

    // carteles en resolución de pantalla, para que se lean nítidos
    var fs = Math.round(11 * dpr);
    ctx.font = "600 " + fs + "px 'JetBrains Mono', ui-monospace, monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    function label(text, wx, wy, accent) {
      var X = wx * S - camX, Y = wy * S - camY;
      if (X < -200 * dpr || X > W + 200 * dpr || Y < -40 || Y > H + 40) return;
      var w = ctx.measureText(text).width + 14 * dpr, h = fs + 10 * dpr;
      ctx.fillStyle = "rgba(24,25,27,.86)";
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(X - w / 2, Y - h / 2, w, h, 4 * dpr); else ctx.rect(X - w / 2, Y - h / 2, w, h);
      ctx.fill();
      ctx.fillStyle = accent || "#dfe1e5"; ctx.fillText(text, X, Y + dpr * 0.5);
    }
    BUILDINGS.forEach(function (b) { label(L(b.label), (b.x + b.w / 2) * T, b.y * T - 2); });
    STALLS.forEach(function (s) { label(s.label, (s.x + 1.5) * T, s.y * T - 2); });
    label(U("market"), 18.5 * T, 17.4 * T, "#cf8e6d");
  }

  var last = 0;
  function loop(now) {
    var dt = Math.min(0.05, (now - last) / 1000 || 0); last = now;
    update(dt);
    draw(now);
    requestAnimationFrame(loop);
  }

  resize();
  applyLang();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
